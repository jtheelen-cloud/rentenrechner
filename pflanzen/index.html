<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pflanzen-Doktor</title>
<meta name="theme-color" content="#2f6b3a">
<meta name="application-name" content="Pflanzen-Doktor">
<meta name="apple-mobile-web-app-title" content="Pflanzen-Doktor">
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="icon" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="shortcut icon" href="icon-192.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f4ec;color:#1f2a1d;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
.c{max-width:420px;display:grid;gap:14px;justify-items:center}
img{width:110px;height:110px;border-radius:26px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
h1{margin:0;font-size:28px}
ol{text-align:left;margin:0;padding-left:22px;display:grid;gap:6px}
a,button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 18px;background:#2f6b3a;color:#fff;text-decoration:none;cursor:pointer;width:100%;box-sizing:border-box;display:block}
button.g{background:transparent;color:#2f6b3a;border:2px solid #2f6b3a}
.mu{color:#5d6b58;font-size:14px}
@media (prefers-color-scheme:dark){body{background:#121810;color:#e8efe3}.mu{color:#9fb098}button.g{color:#7cc488;border-color:#7cc488}}
</style></head><body>
<div class="c" id="box">
  <img src="icon-512.png" alt="">
  <h1>Pflanzen-Doktor</h1>
  <p class="mu" id="go">Wird geöffnet …</p>
</div>
<script>
// Startseite mit eigenem Symbol: beim ersten Mal Anleitung zum Startbildschirm, danach direkt zur App in Claude
var APP="https://claude.ai/artifact/XhxbSe2c9WagwvUa8uHoq4";
var done=false;try{done=localStorage.getItem("pd.setup")==="1"}catch(e){}
if(done&&location.hash!=="#einrichten"){location.replace(APP)}
else{
  var sam=/SamsungBrowser/.test(navigator.userAgent);
  document.getElementById("box").innerHTML='<img src="icon-512.png" alt=""><h1>Pflanzen-Doktor</h1>'+
   '<p>So kommt das Symbol auf den Startbildschirm:</p><ol>'+
   (sam?'<li>Unten auf <b>≡</b> tippen</li><li><b>„Seite hinzufügen zu“</b> → <b>„Startbildschirm“</b></li><li>Name „Pflanzen-Doktor“ lassen → <b>Hinzufügen</b></li>'
       :'<li>Oben rechts auf <b>⋮</b> tippen</li><li><b>„Zum Startbildschirm hinzufügen“</b> wählen</li><li>Bei Nachfrage <b>„Verknüpfung erstellen“</b> bzw. <b>Hinzufügen</b></li>')+
   '</ol><button id="ok" type="button">Erledigt – App öffnen</button><button class="g" id="skip" type="button">Ohne Symbol weiter</button>';
  document.getElementById("ok").onclick=function(){try{localStorage.setItem("pd.setup","1")}catch(e){}location.href=APP};
  document.getElementById("skip").onclick=function(){location.href=APP};
}
</script>
</body></html>
