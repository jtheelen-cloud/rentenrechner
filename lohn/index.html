<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a4d">
<title>Vergütungsmodell</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#1b2730;--muted:#62707b;--line:#d8dee3;--acc:#1f3a4d;--acc2:#2f7d6d;--soft:#e9eef2;--yel:#fff2cc;--red:#c62828;--ok:#2e7d32;
  --sh:0 1px 2px rgba(20,30,40,.06),0 6px 18px rgba(20,30,40,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11171c;--card:#1a232a;--ink:#e6edf2;--muted:#94a3ae;--line:#2c3943;--acc:#9cc3dc;--acc2:#5cc3ad;--soft:#222d35;--yel:#3a3420;--red:#ff7a7a;--ok:#7ccf83;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#1f3a4d;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header h1{margin:0;font-size:19px}header p{margin:2px 0 0;font-size:13px;opacity:.8}
main{max-width:860px;margin:0 auto;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.tab{display:grid;gap:14px;min-width:0}.tab>*{min-width:0}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--sh);min-width:0}
.card h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.lead{margin:0 0 12px;color:var(--muted);font-size:14px}
.chip{display:inline-block;width:12px;height:12px;border-radius:4px;flex:none}
.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
table.lb{border-collapse:separate;border-spacing:0;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
table.lb th,table.lb td{padding:7px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
table.lb th{color:#fff;font-weight:700;font-size:13px}
table.lb td:first-child,table.lb th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;font-weight:600;color:var(--ink)}
table.lb th:first-child{color:#fff}
table.lb tr.big td{font-weight:800;font-size:15px}
table.lb td.g{color:var(--acc2);font-weight:700}
.sp{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;font-size:14px;font-variant-numeric:tabular-nums;align-items:center}
.sp b{text-align:right}.sp .pc{color:var(--acc2);font-weight:800;text-align:right}
.row{display:grid;grid-template-columns:1fr 150px;gap:8px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
input.n,select.n{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--yel);text-align:right;font-variant-numeric:tabular-nums}
select.n{text-align:left;background:var(--bg)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.chk input{width:22px;height:22px}
.res{background:var(--soft);border-radius:14px;padding:14px;margin-top:12px}
.res .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.res .sub{color:var(--muted);font-size:14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kp div{background:var(--card);border-radius:10px;padding:8px}.kp b{display:block;font-variant-numeric:tabular-nums}.kp span{font-size:12px;color:var(--muted)}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--red);font-weight:700}
.ed{width:100%;border-collapse:collapse;font-size:14px}
.ed th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:4px}
.ed td{padding:3px 4px}.ed input,.ed select{width:100%;padding:7px 6px;border-radius:8px;border:1px solid var(--line);background:var(--yel);text-align:right}
.ed select{text-align:left;background:var(--bg)}
.ed.mt input{min-width:92px;font-size:14px}
.x{border:0;background:none;color:var(--red);font-size:18px;padding:4px 8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.p{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
details{border-top:1px solid var(--line);padding:6px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details[open] summary::after{content:"▴"}
.rule{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rule:first-of-type{border-top:0}.rule b{font-size:14px}
.rh{background:#1f3a4d;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;margin:14px 0 4px}
.mu{color:var(--muted);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;padding:9px 2px 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:19px;font-weight:400}
.tabs button[aria-selected=true]{color:var(--acc2);font-weight:700}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
#gate .card{max-width:380px;width:100%;text-align:center}
#gate input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:20px;letter-spacing:.1em;text-transform:uppercase;margin:12px 0}
[hidden]{display:none!important}
@media (max-width:440px){.row{grid-template-columns:1fr 120px}.rule{grid-template-columns:1fr}.kp{grid-template-columns:1fr 1fr}}
@media print{.tabs,header,#gate,.noprint{display:none!important}.tab{display:grid!important}body{padding:0;background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style>
<style>
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:99px;background:var(--acc2)}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.pl:first-of-type{border-top:0}.pl .n{font-weight:700}.pl .f{color:var(--muted);font-size:13px}.pl .v{font-weight:800;text-align:right}.pl .bar{grid-column:1/3}
.yrs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.yrs label{font-size:13px;color:var(--muted)}.yrs input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--yel);text-align:right;font-size:16px}
.row{grid-template-columns:1fr 175px}@media (max-width:440px){.row{grid-template-columns:1fr 160px}}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:1px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);border-radius:12px;padding:4px}
.seg2 button{border:0;border-radius:9px;padding:9px 6px;background:none;font-weight:700;color:var(--muted)}
.seg2 button.on{background:var(--acc2);color:#fff}
.lbx{border-top:1px solid var(--line);padding:10px 0}.lbx:first-of-type{border-top:0}
.lbh{display:flex;flex-direction:column;margin-bottom:6px}.lbh .mu{font-size:12.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.steps div{background:var(--soft);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.steps span{font-size:12px;color:var(--muted)}.steps b{font-size:15px}.steps i{font-style:normal;font-size:13px}
table.lb td small{font-size:11px}
</style>
</head>
<body>
<div id="gate"><div class="card">
  <div style="font-size:44px">📊</div><h2 style="justify-content:center">Vergütungsmodell</h2>
  <p class="mu">Nur für den Besitzer. Bitte Master-Code eingeben.</p>
  <input id="gCode" autocomplete="off" placeholder="XXXX-XXXX">
  <button class="btn p" id="gGo" style="width:100%">Öffnen</button>
  <p id="gErr" class="mu" style="color:var(--red)" hidden>Code stimmt nicht.</p>
</div></div>

<div id="app" hidden>
<header><h1>📊 Vergütungsmodell</h1><p>Grundgehalt × Positionsfaktor + Erfahrung + Betriebstreue · 35-Stunden-Woche · Entwurf</p></header>
<main>
  <section class="tab" id="t1"><div id="tabelle"></div></section>
  <section class="tab" id="t2" hidden>
    <div class="card">
      <h2>🧮 Kollegen durchrechnen</h2>
      <p class="lead">Wo landet jemand im Modell, und was hätte er gegenüber heute?</p>
      <div id="pForm"></div>
      <div id="pRes"></div>
    </div>
  </section>
  <section class="tab" id="t3" hidden><div id="werte"></div></section>
  <section class="tab" id="t4" hidden><div class="card" id="regeln"></div></section>
</main>
<nav class="tabs">
  <button data-t="1" aria-selected="true"><b>📋</b>Übersicht</button>
  <button data-t="2"><b>🧮</b>Person</button>
  <button data-t="3"><b>⚙️</b>Werte</button>
  <button data-t="4"><b>📖</b>Regeln</button>
</nav>
</div>

<script>
"use strict";
const CODE_HASH="f12d8ad9b3af949dee57cc01bae9bbe771f6a8abcfc4f2818abc837c530596e3";
const KEY_OK="lohn.zugang";
function sha256js(str){const K=[1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
const b=[...new TextEncoder().encode(str)],l=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(Math.floor(l/2**(8*i))&255);
let H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225];const r=(x,n)=>(x>>>n)|(x<<(32-n));
for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
let[a,c,d,e,f,g,h,k]=H;for(let i=0;i<64;i++){const S1=r(f,6)^r(f,11)^r(f,25),ch=(f&g)^(~f&h),t1=(k+S1+ch+K[i]+w[i])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&c)^(a&d)^(c&d),t2=(S0+mj)|0;k=h;h=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0}
H=H.map((v,i)=>(v+[a,c,d,e,f,g,h,k][i])|0)}return H.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("")}
const $=id=>document.getElementById(id);
const LSg=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const LSs=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function unlock(){$("gate").hidden=true;$("app").hidden=false;start()}
(function(){
  const keys=[KEY_OK,"admin.zugang","rentenrechner.zugang","br.zugang","wetter.zugang","ahnen.zugang"];
  if(keys.some(k=>LSg(k,"")==="M:"+CODE_HASH)) return setTimeout(unlock,0);
  const go=()=>{const c=$("gCode").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");const f=c.length===8?c.slice(0,4)+"-"+c.slice(4):c;
    if(sha256js("rentenrechner:"+f)===CODE_HASH){LSs(KEY_OK,"M:"+CODE_HASH);unlock()}else $("gErr").hidden=false};
  $("gGo").onclick=go;$("gCode").onkeydown=e=>{if(e.key==="Enter")go()};
})();

/* ---------- Modell (aus Verguetungsmodell_320_Mitarbeiter.xlsx) ---------- */
const DEF={ver:6,
  staffel:[[12,1],[36,.5],[60,.25]], maxFremd:15,
  wiederMax:10,
  sz:{tze1:1000,tze2:644,weih:1.10,gewinn:0,stand:"Tarif Eisen und Stahl NRW"},
  basis:2250, woche:35, maxErf:40, luecke:12, maxRatio:8,
  E:{s:2.40,m:1.59,l:0}, leist:1.10,
  pos:[
    {n:"Geschäftsführer",f:6.0,sub:"Fixgehalt",at:1},
    {n:"Werksleiter",f:4.0,at:1},
    {n:"Betriebsleiter",f:2.9,at:1},
    {n:"Meister mit Brief",f:2.0,sub:"Industrie- oder Gießereimeister"},
    {n:"Werksmeister",f:1.8,sub:"Meister ohne Meisterbrief"},
    {n:"Vorarbeiter",f:1.32,g:1},
    {n:"Kolonnenführer",f:1.26,g:1},
    {n:"Facharbeiter",f:1.2,g:1,sub:"mit Brief, z. B. Former, Kernmacher, Werkstoffprüfer"},
    {n:"Zertifizierte Fachkraft",f:1.1,g:1,sub:"Ungelernte mit Schweiß- oder Prüfschein, 2-jährige Ausbildung"},
    {n:"Ungelernter",f:1,g:1}],
  erf:[[0,0],[5,.03],[10,.05],[15,.07],[20,.09],[25,.10],[30,.11],[40,.12]],
  treue:[[0,0],[3,.01],[6,.02],[11,.03],[21,.04],[31,.05]]
};
let C;try{C=JSON.parse(LSg("verg.cfg",""))}catch(e){}
if(!C||C.ver!==DEF.ver)C=structuredClone(DEF);
const fe=p=>Math.min(p.f,C.maxRatio); /* Pay-Ratio-Deckel */
const save=()=>LSs("verg.cfg",JSON.stringify(C));

const eur=(v,d=2)=>isFinite(v)?v.toLocaleString("de-DE",{style:"currency",currency:"EUR",minimumFractionDigits:d,maximumFractionDigits:d}):"–";
const pct=(v,d=1)=>isFinite(v)?(v*100).toLocaleString("de-DE",{minimumFractionDigits:0,maximumFractionDigits:d})+" %":"–";
const num=(v,d=2)=>isFinite(v)?v.toLocaleString("de-DE",{maximumFractionDigits:d}):"";
const pn=s=>{s=String(s??"").trim().replace(/\s|€|%/g,"");if(!s)return NaN;if(/,/.test(s))s=s.replace(/\./g,"").replace(",",".");else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");const x=parseFloat(s);return isFinite(x)?x:NaN};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const r2=x=>Math.round(x*100)/100;
const stdMonat=()=>C.woche*52/12;
/* Erfahrung: volle Jahre, linear zwischen den Stützstellen (wie in der Excel-Tabelle) */
function erfZ(j){j=Math.max(0,Math.min(Math.floor(j),C.maxErf));const P=[...C.erf].sort((a,b)=>a[0]-b[0]);
  for(let i=0;i<P.length-1;i++){const[a,x]=P[i],[b,y]=P[i+1];if(j>=a&&j<=b)return x+(y-x)*(j-a)/(b-a)}return P.at(-1)[1]}
/* Betriebszugehörigkeit: Stufen */
function treueZ(j){let z=0;[...C.treue].sort((a,b)=>a[0]-b[0]).forEach(([a,v])=>{if(j>=a)z=v});return z}
function calc(p,erf,treue){const grund=C.basis*fe(p),ez=erfZ(erf),tz=treueZ(treue),m=grund*(1+ez+tz);return{grund,ez,tz,m,j:m*12,h:m/stdMonat()}}

/* ---------- Übersicht ---------- */
let OV={erf:"0",tr:"0"};try{Object.assign(OV,JSON.parse(LSg("verg.ov","{}")))}catch(e){}
function drawTableOwn(){
  const e=pn(OV.erf)||0,t=pn(OV.tr)||0;
  const rows=C.pos.map(p=>({p,...calc(p,e,t)}));const max=Math.max(...rows.map(r=>r.m));
  const u=C.pos.find(p=>p.f===Math.min(...C.pos.map(x=>x.f)));
  let h=`<div class="card"><h2>Alle Positionen</h2><p class="lead">Grundlohn im Monat bei gleichen Jahren – Jahre hier ändern zum Vergleichen.</p>
   <div class="yrs"><div><label>Berufserfahrung (Jahre)</label><input id="ovE" inputmode="numeric" value="${esc(OV.erf)}"></div>
   <div><label>Betriebszugehörigkeit (Jahre)</label><input id="ovT" inputmode="numeric" value="${esc(OV.tr)}"></div></div>
   <p class="mu" style="margin:0 0 6px">Zuschlag: Erfahrung ${pct(erfZ(e))} + Betriebstreue ${pct(treueZ(t))} = <b>${pct(erfZ(e)+treueZ(t))}</b></p>
   ${rows.map(r=>`<div class="pl"><span><span class="n">${esc(r.p.n)}</span>${r.p.neu?'<span class="tag">Vorschlag</span>':""}<br><span class="f">Faktor ${num(fe(r.p),2)} · ${eur(r.h)} je Std.${r.p.g?" Grundlohn":""}</span></span><span class="v">${eur(r.m,0)}</span><div class="bar"><i style="width:${r.m/max*100}%"></i></div></div>`).join("")}
   <p class="mu" style="margin:10px 0 0">Pay-Ratio oben zu unten: <b>${num(Math.max(...C.pos.map(fe))/fe(u),1)} : 1</b> (Deckel ${num(C.maxRatio,0)} : 1). Grundlöhne bei ${num(C.woche,0)} Wochenstunden. Bei Gewerblichen kommen Erschwerniszulage und Leistungsgrad dazu (siehe 🧮 Person), bei allen Überstunden und Sonderzahlungen.</p></div>`;
  // Zuschlagstabellen
  const ys=[0,5,10,15,20,25,30,35,40];
  h+=`<div class="card"><h2>Zuschläge</h2>
   <div class="scroll"><table class="lb"><tr><th style="background:#2f7d6d">Jahre</th>${ys.map(y=>`<th style="background:#2f7d6d">${y}</th>`).join("")}</tr>
   <tr><td>Berufserfahrung</td>${ys.map(y=>`<td>${pct(erfZ(y))}</td>`).join("")}</tr>
   <tr><td>Betriebstreue</td>${ys.map(y=>`<td>${pct(treueZ(y))}</td>`).join("")}</tr>
   <tr class="big"><td>zusammen*</td>${ys.map(y=>`<td>${pct(erfZ(y)+treueZ(y))}</td>`).join("")}</tr></table></div>
   <p class="mu" style="margin:8px 0 0">*wenn alle Jahre im Betrieb waren. Erfahrung höchstens ${num(C.maxErf,0)} Jahre und ${pct(erfZ(99))}, Betriebstreue höchstens ${pct(treueZ(999))}.</p></div>`;
  // Laufbahn-Matrix: Positionen × Jahre (alles im Betrieb)
  h+=`<div class="card"><h2>Tabelle: Monatsbrutto nach Jahren</h2><p class="lead">Wenn alle Jahre im Betrieb gesammelt wurden.</p>
   <div class="scroll"><table class="lb"><tr><th style="background:#1f3a4d">Position</th>${ys.map(y=>`<th style="background:#1f3a4d">${y?y+" J.":"Einstieg"}</th>`).join("")}</tr>
   ${C.pos.map(p=>`<tr><td>${esc(p.n)}</td>${ys.map(y=>`<td>${eur(calc(p,y,y).m,0)}</td>`).join("")}</tr>`).join("")}</table></div>
   <div class="btns noprint"><button class="btn" onclick="print()">🖨️ Drucken / PDF</button></div></div>`;
  $("tabelle").innerHTML=h;
  ["ovE","ovT"].forEach(id=>$(id).addEventListener("change",()=>{OV={erf:$("ovE").value,tr:$("ovT").value};LSs("verg.ov",JSON.stringify(OV));drawTable()}));
}

/* ---------- Person ---------- */
let P={pos:"Facharbeiter",jb:"",ja:"",lu:"",wi:false,wj:"",wg:"",bel:"m",eig:"",lg:"",heute:""};
try{Object.assign(P,JSON.parse(LSg("verg.person","{}")))}catch(e){}
function drawPersonFormOwn(){

   <label class="chk"><input type="checkbox" id="pWi" ${P.wi?"checked":""}><span><b>Wiedereinstellung</b> – war früher schon bei uns<br><small class="mu">Neueinstellung: Häkchen weglassen, dann gelten die normalen Regeln</small></span></label>
   <div class="row wi"><label>Frühere Jahre bei uns<small>vor dem Ausscheiden</small></label><input class="n" id="pWj" inputmode="decimal" value="${esc(P.wj)}" placeholder="0"></div>
   <div class="row wi"><label>Jahre weg vom Betrieb<small>zählt, wenn höchstens ${num(C.wiederMax,0)} Jahre</small></label><input class="n" id="pWg" inputmode="decimal" value="${esc(P.wg)}" placeholder="0"></div>
   <div class="row"><label>Jahre im Betrieb<small>seit der (Wieder-)Einstellung</small></label><input class="n" id="pJb" inputmode="decimal" value="${esc(P.jb)}" placeholder="0"></div>
   <div class="row"><label>Jahre in anderen Betrieben<small>gleiche oder gleichwertige Tätigkeit, nachgewiesen (bei Wiedereinstellung: die Jahre dazwischen)</small></label><input class="n" id="pJa" inputmode="decimal" value="${esc(P.ja)}" placeholder="0"></div>
   <div class="row"><label>Lücke seit der letzten gleichwertigen Tätigkeit (Monate)<small>${C.staffel.map(([m,f])=>"bis "+num(m,0)+" Mon.: "+(f===1?"voll":num(f*100,0)+" %")).join(" · ")} · max. ${num(C.maxFremd,0)} Jahre</small></label><input class="n" id="pLu" inputmode="decimal" value="${esc(P.lu)}" placeholder="0"></div>
   <div class="row gw"><label>Erschwerniszulage<small>nach Belastung am Arbeitsplatz</small></label><select class="n" id="pBel">${[["","keine"],["l","leicht "+eur(C.E.l)],["m","mittel "+eur(C.E.m)],["s","schwer "+eur(C.E.s)],["e","eigener Betrag"]].map(o=>`<option value="${o[0]}" ${o[0]===P.bel?"selected":""}>${o[1]}</option>`).join("")}</select></div>
   <div class="row gw" id="pEigRow"><label>Eigene Erschwerniszulage €/Std.</label><input class="n" id="pEig" inputmode="decimal" value="${esc(P.eig)}" placeholder="€"></div>
   <div class="row gw"><label>Leistungsgrad in %<small>leer = Standard ${num(C.leist*100,0)} %</small></label><input class="n" id="pLg" inputmode="decimal" value="${esc(P.lg)}" placeholder="${num(C.leist*100,0)}"></div>
   <div class="row"><label>Heutiges Monatsbrutto<small>optional, zum Vergleich (gleich gerechnet: mit Zulage und Leistungsgrad)</small></label><input class="n" id="pHeute" inputmode="decimal" value="${esc(P.heute)}" placeholder="€"></div>`;
  ["pPos","pWi","pWj","pWg","pJb","pJa","pLu","pBel","pEig","pLg","pHeute"].forEach(id=>$(id).addEventListener("input",()=>{
    P={pos:$("pPos").value,wi:$("pWi").checked,wj:$("pWj").value,wg:$("pWg").value,jb:$("pJb").value,ja:$("pJa").value,lu:$("pLu").value,bel:$("pBel").value,eig:$("pEig").value,lg:$("pLg").value,heute:$("pHeute").value};
    LSs("verg.person",JSON.stringify(P));gwVis();drawPersonRes()}));
  gwVis();drawPersonRes();

function anrF(m){for(const[x,f]of[...C.staffel].sort((a,b)=>a[0]-b[0]))if(m<=x)return f;return 0}
function jahr(p,m){if(p.at)return{w:0,t:0,g:0,sum:m*12};const w=m*C.sz.weih,t=C.sz.tze1+C.sz.tze2,g=C.sz.gewinn||0;return{w,t,g,sum:m*12+w+t+g}}
function gwVis(){document.querySelectorAll("#pForm .wi").forEach(el=>el.hidden=!P.wi);const p=C.pos.find(x=>x.n===P.pos)||C.pos[0];document.querySelectorAll("#pForm .gw").forEach(el=>el.hidden=!p.g||(el.id==="pEigRow"&&P.bel!=="e"))}
function drawPersonRes(){
  const p=C.pos.find(x=>x.n===P.pos)||C.pos[0];
  const jb=pn(P.jb)||0,ja=pn(P.ja)||0,lu=pn(P.lu)||0;
  const wj=P.wi?(pn(P.wj)||0):0,wg=pn(P.wg)||0,wOk=P.wi&&wj>0&&wg<=C.wiederMax,wAn=wOk?wj:0;
  const sf=P.wi?1:anrF(lu),anr=Math.min(ja*sf,C.maxFremd),erf=jb+anr+wAn,tr=jb+wAn;
  const r=calc(p,erf,tr);
  const E=p.g?(P.bel==="e"?(pn(P.eig)||0):(P.bel?C.E[P.bel]:0)):0,LG=p.g?((pn(P.lg)||C.leist*100)/100):1;
  const tot=x=>p.g?r2((x.h+E)*LG):x.h, totM=x=>p.g?Math.round(tot(x)*stdMonat()):x.m;
  const th=tot(r),tm=totM(r);
  // nächste Steigerung
  let nx=null;for(let y=1;y<=45;y++){const n=calc(p,erf+y,tr+y);if(n.m>r.m+0.5){nx={y,n,m:totM(n)};break}}
  const heute=pn(P.heute);
  $("pRes").innerHTML=`<div class="res">
    <div class="sub">${esc(p.n)} · Faktor ${num(p.f,2)} · ${num(erf,1)} Jahre Erfahrung${ja?` (davon ${num(anr,1)} aus anderen Betrieben${sf===0?" – Lücke zu lang":sf<1?` – ${num(sf*100,0)} % wegen Lücke`:""}${ja*sf>C.maxFremd?` – höchstens ${num(C.maxFremd,0)} Jahre`:""})`:""} · ${num(tr,1)} Jahre Betriebszugehörigkeit${P.wi?(wOk?` (inkl. ${num(wj,1)} frühere Jahre – Wiedereinstellung)`:wj?` (frühere Jahre zählen nicht: länger als ${num(C.wiederMax,0)} Jahre weg)`:""):""}</div>
    <div class="big">${p.g?eur(th)+' <span style="font-size:16px;font-weight:600">je Stunde</span>':eur(tm,0)+' <span style="font-size:16px;font-weight:600">im Monat</span>'}</div>
    <div class="sub">Grundlohn: ${eur(C.basis,0)} × ${num(fe(p),2)} + Erfahrung ${pct(r.ez)} + Betriebstreue ${pct(r.tz)} = ${eur(r.m,0)} im Monat (${eur(r.h)}/Std.)${p.g?` · mit Erschwerniszulage ${eur(E)} und ${num(LG*100,1)} %: (${eur(r.h)} + ${eur(E)}) × ${num(LG*100,1)} % = ${eur(th)}`:""}</div>
    <div class="kp"><div><b>${eur(tm,0)}</b><span>im Monat</span></div><div><b>${eur(jahr(p,tm).sum,0)}</b><span>im Jahr inkl. Sonderzahlungen</span></div><div><b>${eur(th)}</b><span>je Stunde</span></div></div>
    <p class="mu" style="margin:8px 0 0">${(()=>{const J=jahr(p,tm);return p.at?`12 × ${eur(tm,0)} = ${eur(J.sum,0)} · außertariflich: tarifliche Sonderzahlungen gelten nicht`:`12 × ${eur(tm,0)} + Weihnachtsgeld ${eur(J.w,0)} + Tarifzusatzentgelt ${eur(J.t,0)}${J.g?" + Gewinnbeteiligung "+eur(J.g,0):""} = ${eur(J.sum,0)}`})()}</p>
    ${isFinite(heute)&&heute>0?`<p style="margin:10px 0 0">Gegenüber heute: <b class="${tm>=heute?"pos":"neg"}">${tm>=heute?"+":""}${eur(tm-heute,0)} im Monat (${tm>=heute?"+":""}${pct(tm/heute-1)})</b></p>`:""}
    <p class="mu" style="margin:10px 0 0">${nx?`Nächste Steigerung in <b>${nx.y} ${nx.y===1?"Jahr":"Jahren"}</b>: ${eur(nx.m,0)} (+${eur(nx.m-tm,0)})`:"Höchststufe erreicht."} Überstunden kommen dazu.</p></div>`;
}

   <div class="row"><label>Erschwerniszulage mittel €/Std.<small>Kernmacherei, Formerei – Wert Kernmacher</small></label><input class="n" data-k="E.m" inputmode="decimal" value="${num(C.E.m,2)}"></div>
   <div class="row"><label>Erschwerniszulage leicht €/Std.<small>Prüferei, Labor</small></label><input class="n" data-k="E.l" inputmode="decimal" value="${num(C.E.l,2)}"></div>
   <div class="row"><label>Leistungsgrad Standard in %<small>nur Gewerbliche</small></label><input class="n" data-k="leistP" inputmode="decimal" value="${num(C.leist*100,1)}"></div>

  <div class="card"><h2>Anrechnung fremder Erfahrung</h2><p class="lead">Je länger die Lücke seit der letzten gleichwertigen Tätigkeit, desto weniger wird angerechnet. Darüber: nichts.</p>
   <table class="ed"><tr><th>Lücke bis (Monate)</th><th>Anrechnung %</th></tr>
   ${C.staffel.map((s,i)=>`<tr><td><input data-st="${i}.0" inputmode="decimal" value="${num(s[0],0)}"></td><td><input data-st="${i}.1" inputmode="decimal" value="${num(s[1]*100,0)}"></td></tr>`).join("")}</table></div>
  <div class="card"><h2>Sonderzahlungen</h2><p class="lead">Aus der BR-App (${esc(C.sz.stand)}). Gelten für Tarifbeschäftigte, nicht für Betriebs-, Werksleiter und Geschäftsführer.</p>

   <div class="row"><label>Tarifzusatzentgelt II (Februar) €</label><input class="n" data-k="sz.tze2" inputmode="decimal" value="${num(C.sz.tze2,2)}"></div>

  <div class="card"><h2>Positionen und Faktoren</h2><p class="lead">Faktor 1 = Grundlohn Ungelernter. Ausgangswerte so gewählt, dass die Gesamtvergütung marktüblich ist (Stand 2026, Schätzung). Faktoren über dem Pay-Ratio-Deckel werden gekappt.</p>
   <table class="ed"><tr><th>Position</th><th style="width:90px">Faktor</th><th style="text-align:right">Grundlohn</th><th></th></tr>
   ${C.pos.map((p,i)=>`<tr><td><input data-pn="${i}" value="${esc(p.n)}" style="text-align:left;background:var(--bg)"></td><td><input data-pf="${i}" inputmode="decimal" value="${num(p.f,2)}"></td><td style="text-align:right;white-space:nowrap">${eur(C.basis*fe(p),0)}${p.f>C.maxRatio?" ⚠️":""}</td><td><button class="x" data-pd="${i}">✕</button></td></tr>`).join("")}</table>

  W.querySelectorAll("[data-k]").forEach(el=>el.onchange=()=>{const k=el.dataset.k,x=pn(el.value);if(isFinite(x)&&x>=0){if(k==="leistP")C.leist=x/100;else if(k==="sz.weihP")C.sz.weih=x/100;else if(k.startsWith("sz."))C.sz[k.slice(3)]=x;else if(k.startsWith("E."))C.E[k.slice(2)]=x;else if(x>0)C[k]=x}re();drawWerte()});
  W.querySelectorAll("[data-pn]").forEach(el=>el.onchange=()=>{const v=el.value.trim();if(v){if(P.pos===C.pos[+el.dataset.pn].n)P.pos=v;C.pos[+el.dataset.pn].n=v;delete C.pos[+el.dataset.pn].neu}re();drawWerte()});
  W.querySelectorAll("[data-pf]").forEach(el=>el.onchange=()=>{const x=pn(el.value);if(isFinite(x)&&x>0){C.pos[+el.dataset.pf].f=x;delete C.pos[+el.dataset.pf].neu}re();drawWerte()});
  W.querySelectorAll("[data-pd]").forEach(b=>b.onclick=()=>{if(C.pos.length<2)return;if(!confirm(`Position „${C.pos[+b.dataset.pd].n}“ löschen?`))return;C.pos.splice(+b.dataset.pd,1);re();drawWerte()});
  $("bAddPos").onclick=()=>{C.pos.push({n:"Neue Position",f:1,g:1});re();drawWerte()};
  const tbl=(attr,arr)=>{W.querySelectorAll(`[data-${attr}]`).forEach(el=>el.onchange=()=>{const[i,k]=el.dataset[attr].split(".").map(Number);const x=pn(el.value);if(isFinite(x))C[arr][i][k]=k?x/100:x;re();drawWerte()})};
  tbl("e","erf");tbl("t","treue");tbl("st","staffel");
  W.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{if(C.erf.length>2){C.erf.splice(+b.dataset.ed,1);re();drawWerte()}});
  W.querySelectorAll("[data-td]").forEach(b=>b.onclick=()=>{if(C.treue.length>1){C.treue.splice(+b.dataset.td,1);re();drawWerte()}});

  $("bAddT").onclick=()=>{const l=C.treue.at(-1);C.treue.push([l[0]+5,l[1]]);re();drawWerte()};
  $("bSz").onclick=()=>loadSz(true);
  $("bReset").onclick=()=>{if(confirm("Alle Werte auf die marktüblichen Ausgangswerte zurücksetzen?")){C=structuredClone(DEF);save();drawAll()}};
}

  {n:"Werksmeister",m:"M 2",sub:"Meister ohne Meisterbrief"},
  {n:"Meister mit Brief",m:"M 3",sub:"Industrie- oder Gießereimeister"}];
DEF.tl=TL_DEF;DEF.mode="tarif";
if(!C.tl)C.tl=structuredClone(TL_DEF);
if(!C.mode)C.mode="tarif";
/* Tarifwerte Eisen und Stahl NRW ab 01.01.2026 – werden beim Start aus der BR-App (br/tarif.json) aktualisiert */
let TAR={stand:"gültig ab 01.01.2026",
  lg:{"LG 1":14.69,"LG 2":15.20,"LG 3":15.65,"LG 4":16.40,"LG 5":17.12,"LG 6":18.00,"LG 7":18.94,"LG 8":20.33,"LG 9":22.11},
  m:{"M 2":[3950.18,4141.02,4332.72,4525.33],"M 3":[4525.33,4730.72,4928.89,5133.32],"M 4":[5133.32,5454.72,5786.13,5786.13]}};
const LGS=()=>Object.keys(TAR.lg), MS=()=>Object.keys(TAR.m);
const tlBase=t=>t.base?(C.tl.find(x=>x.n===t.base)||t):t;
function tStep(t,y){const b=tlBase(t);if(!b.st)return null;let s=b.st[0];[...b.st].sort((a,c)=>a[0]-c[0]).forEach(x=>{if(y>=x[0])s=x});return s}
function tNext(t,y){const b=tlBase(t);if(!b.st)return null;return [...b.st].sort((a,c)=>a[0]-c[0]).find(x=>x[0]>y)||null}
function tCalc(t,y){
  if(t.m){const a=TAR.m[t.m]||[0,0,0,0],i=Math.max(0,Math.min(3,Math.floor(y)));const m=a[i]||a[i-1]||0;return{grp:t.m,stufe:i,m,h:m/stdMonat(),zu:0}}
  const s=tStep(t,y),lg=s?s[1]:LGS()[0],zu=t.zu||0,h=r2((TAR.lg[lg]||0)*(1+zu));return{grp:lg,h,m:h*stdMonat(),zu}}
const stufeTxt=i=>["1. Jahr","2. Jahr","3. Jahr","ab 4. Jahr"][i];

function modeBar(){return `<div class="card noprint"><div class="seg2"><button data-mode="tarif" class="${C.mode==="tarif"?"on":""}">Nach Tarif (heute)</button><button data-mode="eigen" class="${C.mode!=="tarif"?"on":""}">Eigenes Modell</button></div>
  <p class="mu" style="margin:8px 0 0">${C.mode==="tarif"?"Gleiche Tariftabelle wie heute – nur transparent: Wer kommt nach wie vielen Jahren in welche Lohngruppe?":"Eigener Entwurf mit Grundgehalt × Faktor, Erfahrungs- und Treuezuschlag."}</p></div>`}
function bindMode(){document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{C.mode=b.dataset.mode;save();setHead();drawAll()})}
function setHead(){document.querySelector("header p").textContent=C.mode==="tarif"?"Tarif Eisen und Stahl NRW · Laufbahn nach Jahren · 35-Stunden-Woche · Entwurf":"Grundgehalt × Positionsfaktor + Erfahrung + Betriebstreue · 35-Stunden-Woche · Entwurf"}

function drawTable(){
  if(C.mode!=="tarif"){drawTableOwn();$("tabelle").insertAdjacentHTML("afterbegin",modeBar());bindMode();return}
  const ys=[0,2,3,4,5,7,8,10,15,20];
  let h=modeBar();
  h+=`<div class="card"><h2>Laufbahnen nach Jahren</h2><p class="lead">Tariflohn Eisen und Stahl NRW (${esc(TAR.stand)}). Gezählt werden die Jahre Berufserfahrung, wie im Reiter 🧮 Person.</p>`+
   C.tl.map(t=>{
    if(t.m){const a=TAR.m[t.m]||[];return `<div class="lbx"><div class="lbh"><b>${esc(t.n)}</b><span class="mu">${esc(t.sub||"")}</span></div>
      <div class="steps">${[0,1,2,3].map(i=>`<div><span>${stufeTxt(i)}</span><b>${esc(t.m)}</b><i>${eur(a[i]||a[i-1]||0,0)}</i></div>`).join("")}</div></div>`}
    const b=tlBase(t);return `<div class="lbx"><div class="lbh"><b>${esc(t.n)}</b><span class="mu">${esc(t.sub||"")}${t.zu?` · +${pct(t.zu,0)}`:""}</span></div>
      <div class="steps">${[...(b.st||[])].sort((x,y)=>x[0]-y[0]).map(([y,lg])=>{const c=tCalc(t,y);return `<div><span>${y?"ab "+num(y,0)+" J.":"Einstieg"}</span><b>${esc(lg)}</b><i>${eur(c.h)}/Std.</i><i>${eur(c.m,0)}</i></div>`}).join("")}</div></div>`}).join("")+
   `<p class="mu" style="margin:10px 0 0">Monatswerte = Stundenlohn × ${num(stdMonat(),2)} Std. (${num(C.woche,0)}-Stunden-Woche). Dazu kommen bei Gewerblichen Erschwerniszulage und Leistungsgrad, bei allen Sonderzahlungen und Überstunden.</p></div>`;
  h+=`<div class="card"><h2>Tabelle: Grundlohn nach Jahren</h2><p class="lead">Lohngruppe und Monatsbrutto ohne Zulagen.</p>
   <div class="scroll"><table class="lb"><tr><th style="background:#1f3a4d">Position</th>${ys.map(y=>`<th style="background:#1f3a4d">${y?y+" J.":"Einstieg"}</th>`).join("")}</tr>
   ${C.tl.map(t=>`<tr><td>${esc(t.n)}</td>${ys.map(y=>{const c=tCalc(t,y);return `<td><small class="mu">${esc(c.grp)}</small><br>${eur(c.m,0)}</td>`}).join("")}</tr>`).join("")}</table></div>
   <p class="mu" style="margin:8px 0 0">Betriebsleiter, Werksleiter und Geschäftsführer sind außertariflich und stehen deshalb nicht in der Tariftabelle.</p>
   <div class="btns noprint"><button class="btn" onclick="print()">🖨️ Drucken / PDF</button></div></div>`;
  $("tabelle").innerHTML=h;bindMode();
}

function drawPersonForm(){
  if(C.mode!=="tarif")return drawPersonFormOwn();
  if(!C.tl.some(t=>t.n===P.pos))P.pos=C.tl[0].n;
  $("pForm").innerHTML=`
   <div class="row"><label>Position</label><select class="n" id="pPos">${C.tl.map(t=>`<option ${t.n===P.pos?"selected":""}>${esc(t.n)}</option>`).join("")}</select></div>
   <label class="chk"><input type="checkbox" id="pWi" ${P.wi?"checked":""}><span><b>Wiedereinstellung</b> – war früher schon bei uns</span></label>
   <div class="row wi"><label>Frühere Jahre bei uns</label><input class="n" id="pWj" inputmode="decimal" value="${esc(P.wj)}" placeholder="0"></div>
   <div class="row wi"><label>Jahre weg vom Betrieb<small>zählt, wenn höchstens ${num(C.wiederMax,0)} Jahre</small></label><input class="n" id="pWg" inputmode="decimal" value="${esc(P.wg)}" placeholder="0"></div>
   <div class="row"><label>Jahre im Betrieb<small>in dieser Position bzw. gleichwertiger Tätigkeit</small></label><input class="n" id="pJb" inputmode="decimal" value="${esc(P.jb)}" placeholder="0"></div>
   <div class="row"><label>Jahre in anderen Betrieben<small>gleiche oder gleichwertige Tätigkeit, nachgewiesen</small></label><input class="n" id="pJa" inputmode="decimal" value="${esc(P.ja)}" placeholder="0"></div>
   <div class="row"><label>Lücke seit der letzten gleichwertigen Tätigkeit (Monate)<small>${C.staffel.map(([m,f])=>"bis "+num(m,0)+" Mon.: "+(f===1?"voll":num(f*100,0)+" %")).join(" · ")} · max. ${num(C.maxFremd,0)} Jahre</small></label><input class="n" id="pLu" inputmode="decimal" value="${esc(P.lu)}" placeholder="0"></div>
   <div class="row gw"><label>Erschwerniszulage<small>nach Belastung am Arbeitsplatz</small></label><select class="n" id="pBel">${[["","keine"],["l","leicht "+eur(C.E.l)],["m","mittel "+eur(C.E.m)],["s","schwer "+eur(C.E.s)],["e","eigener Betrag"]].map(o=>`<option value="${o[0]}" ${o[0]===P.bel?"selected":""}>${o[1]}</option>`).join("")}</select></div>
   <div class="row gw" id="pEigRow"><label>Eigene Erschwerniszulage €/Std.</label><input class="n" id="pEig" inputmode="decimal" value="${esc(P.eig)}" placeholder="€"></div>
   <div class="row gw"><label>Leistungsgrad in %<small>leer = Standard ${num(C.leist*100,0)} %</small></label><input class="n" id="pLg" inputmode="decimal" value="${esc(P.lg)}" placeholder="${num(C.leist*100,0)}"></div>
   <div class="row"><label>Heutiges Monatsbrutto<small>optional, zum Vergleich</small></label><input class="n" id="pHeute" inputmode="decimal" value="${esc(P.heute)}" placeholder="€"></div>`;
  ["pPos","pWi","pWj","pWg","pJb","pJa","pLu","pBel","pEig","pLg","pHeute"].forEach(id=>$(id).addEventListener("input",()=>{
    P={pos:$("pPos").value,wi:$("pWi").checked,wj:$("pWj").value,wg:$("pWg").value,jb:$("pJb").value,ja:$("pJa").value,lu:$("pLu").value,bel:$("pBel").value,eig:$("pEig").value,lg:$("pLg").value,heute:$("pHeute").value};
    LSs("verg.person",JSON.stringify(P));tGwVis();tPersonRes()}));
  tGwVis();tPersonRes();
}
function tGwVis(){document.querySelectorAll("#pForm .wi").forEach(el=>el.hidden=!P.wi);const t=C.tl.find(x=>x.n===P.pos)||C.tl[0];document.querySelectorAll("#pForm .gw").forEach(el=>el.hidden=!t.g||(el.id==="pEigRow"&&P.bel!=="e"))}
function tPersonRes(){
  const t=C.tl.find(x=>x.n===P.pos)||C.tl[0];
  const jb=pn(P.jb)||0,ja=pn(P.ja)||0,lu=pn(P.lu)||0,wj=P.wi?(pn(P.wj)||0):0,wg=pn(P.wg)||0,wOk=P.wi&&wj>0&&wg<=C.wiederMax,wAn=wOk?wj:0;
  const sf=P.wi?1:anrF(lu),anr=Math.min(ja*sf,C.maxFremd),erf=jb+anr+wAn;
  const c=tCalc(t,erf);
  const E=t.g?(P.bel==="e"?(pn(P.eig)||0):(P.bel?C.E[P.bel]:0)):0,LG=t.g?((pn(P.lg)||C.leist*100)/100):1;
  const th=t.g?r2((c.h+E)*LG):c.h,tm=t.g?Math.round(th*stdMonat()):c.m;
  const J=jahr({},tm),heute=pn(P.heute);
  let nx="";
  if(t.m){if(c.stufe<3){const n=tCalc(t,Math.floor(erf)+1);nx=`Nächste Stufe in ${num(Math.max(1,Math.ceil(Math.floor(erf)+1-erf)),0)} Jahr: ${eur(n.m,0)} (+${eur(n.m-c.m,0)})`}else nx="Höchste Stufe der Gruppe erreicht."}
  else{const n=tNext(t,erf);if(n){const nc=tCalc(t,n[0]),nth=t.g?r2((nc.h+E)*LG):nc.h;nx=`Nächste Lohngruppe <b>${esc(n[1])}</b> in <b>${num(Math.ceil(n[0]-erf),0)} ${Math.ceil(n[0]-erf)===1?"Jahr":"Jahren"}</b>: ${eur(nth)}/Std. (+${eur(nth-th)})`}else nx="Höchste Lohngruppe der Laufbahn erreicht."}
  $("pRes").innerHTML=`<div class="res">
    <div class="sub">${esc(t.n)} · ${num(erf,1)} Jahre Erfahrung${ja?` (davon ${num(anr,1)} aus anderen Betrieben${sf===0?" – Lücke zu lang":sf<1?` – ${num(sf*100,0)} % wegen Lücke`:""})`:""}${P.wi?(wOk?` · inkl. ${num(wj,1)} frühere Jahre`:wj?` · frühere Jahre zählen nicht`:""):""}</div>
    <div class="big">${esc(c.grp)}${t.m?` <span style="font-size:16px;font-weight:600">${stufeTxt(c.stufe)}</span>`:""}</div>
    <div class="sub">${t.m?`Tarifgehalt ${eur(c.m,0)} im Monat`:`Tariflohn ${eur(TAR.lg[c.grp])}/Std.${c.zu?` + Funktionszulage ${pct(c.zu,0)} = ${eur(c.h)}`:""}${t.g?` · mit Erschwerniszulage ${eur(E)} und ${num(LG*100,1)} %: (${eur(c.h)} + ${eur(E)}) × ${num(LG*100,1)} % = <b>${eur(th)}</b>`:""}`}</div>
    <div class="kp"><div><b>${eur(tm,0)}</b><span>im Monat</span></div><div><b>${eur(J.sum,0)}</b><span>im Jahr inkl. Sonderzahlungen</span></div><div><b>${eur(th)}</b><span>je Stunde</span></div></div>
    <p class="mu" style="margin:8px 0 0">12 × ${eur(tm,0)} + Weihnachtsgeld ${eur(J.w,0)} + Tarifzusatzentgelt ${eur(J.t,0)}${J.g?" + Gewinnbeteiligung "+eur(J.g,0):""} = ${eur(J.sum,0)}</p>
    ${isFinite(heute)&&heute>0?`<p style="margin:10px 0 0">Gegenüber heute: <b class="${tm>=heute?"pos":"neg"}">${tm>=heute?"+":""}${eur(tm-heute,0)} im Monat (${tm>=heute?"+":""}${pct(tm/heute-1)})</b></p>`:""}
    <p class="mu" style="margin:10px 0 0">${nx} Überstunden kommen dazu.</p></div>`;
}

function drawWerte(openIx){
  drawWerteOwn(openIx);
  const W=$("werte");W.insertAdjacentHTML("afterbegin",modeBar());bindMode();
  if(C.mode!=="tarif")return;
  // im Tarif-Modus: Faktoren, Pay-Ratio und Zuschlagstabellen ausblenden
  W.querySelectorAll(".card").forEach(c=>{const h=c.querySelector("h2");if(h&&/Positionen und Faktoren|Zuschlag Berufserfahrung|Zuschlag Betriebszugehörigkeit/.test(h.textContent))c.hidden=true});
  W.querySelectorAll('[data-k="basis"],[data-k="maxRatio"],[data-k="maxErf"]').forEach(el=>el.closest(".row").hidden=true);
  const lgOpt=sel=>LGS().map(g=>`<option ${g===sel?"selected":""}>${g}</option>`).join(""),mOpt=sel=>MS().map(g=>`<option ${g===sel?"selected":""}>${g}</option>`).join("");
  const html=`<div class="card"><h2>Laufbahnen</h2><p class="lead">Ab wie vielen Jahren Erfahrung welche Lohngruppe gilt. Vorschlag – frei anpassbar.</p>
   ${C.tl.map((t,i)=>`<div class="lbx"><div class="lbh"><b>${esc(t.n)}</b></div>
     ${t.m?`<div class="row"><label>Meistergruppe</label><select class="n" data-tm="${i}">${mOpt(t.m)}</select></div>`
      :t.base?`<div class="row"><label>Funktionszulage auf Laufbahn ${esc(t.base)} in %</label><input class="n" data-tz="${i}" inputmode="decimal" value="${num((t.zu||0)*100,1)}"></div>`
      :`<table class="ed"><tr><th>ab Jahren</th><th>Lohngruppe</th><th></th></tr>${t.st.map((s,k)=>`<tr><td><input data-ty="${i}.${k}" inputmode="decimal" value="${num(s[0],0)}"></td><td><select data-tg="${i}.${k}">${lgOpt(s[1])}</select></td><td>${k?`<button class="x" data-tx="${i}.${k}">✕</button>`:""}</td></tr>`).join("")}</table>
        <div class="btns"><button class="btn" data-ta="${i}">＋ Stufe</button></div>`}</div>`).join("")}
   <div class="btns"><button class="btn" id="bTlReset">Laufbahnen zurücksetzen</button></div></div>
  <div class="card"><h2>Tariftabelle</h2><p class="lead">Eisen und Stahl NRW, ${esc(TAR.stand)} – kommt automatisch aus der BR-App.</p>
   <div class="scroll"><table class="lb"><tr>${LGS().map(g=>`<th style="background:#2f7d6d">${g}</th>`).join("")}</tr><tr>${LGS().map(g=>`<td>${eur(TAR.lg[g])}</td>`).join("")}</tr></table></div>
   <div class="scroll" style="margin-top:8px"><table class="lb"><tr><th style="background:#2f7d6d">Meister</th>${[0,1,2,3].map(i=>`<th style="background:#2f7d6d">${stufeTxt(i)}</th>`).join("")}</tr>${MS().map(g=>`<tr><td>${g}</td>${TAR.m[g].map(v=>`<td>${eur(v,0)}</td>`).join("")}</tr>`).join("")}</table></div></div>`;
  W.querySelector(".card:not(.noprint)").insertAdjacentHTML("beforebegin",html);
  const re=()=>{save();drawTable();drawPersonForm();drawWerte()};
  W.querySelectorAll("[data-ty]").forEach(el=>el.onchange=()=>{const[i,k]=el.dataset.ty.split(".").map(Number),x=pn(el.value);if(isFinite(x)&&x>=0)C.tl[i].st[k][0]=x;re()});
  W.querySelectorAll("[data-tg]").forEach(el=>el.onchange=()=>{const[i,k]=el.dataset.tg.split(".").map(Number);C.tl[i].st[k][1]=el.value;re()});
  W.querySelectorAll("[data-tx]").forEach(b=>b.onclick=()=>{const[i,k]=b.dataset.tx.split(".").map(Number);C.tl[i].st.splice(k,1);re()});
  W.querySelectorAll("[data-ta]").forEach(b=>b.onclick=()=>{const t=C.tl[+b.dataset.ta],l=t.st.at(-1),g=LGS(),n=g[Math.min(g.length-1,g.indexOf(l[1])+1)];t.st.push([l[0]+5,n]);re()});
  W.querySelectorAll("[data-tm]").forEach(el=>el.onchange=()=>{C.tl[+el.dataset.tm].m=el.value;re()});
  W.querySelectorAll("[data-tz]").forEach(el=>el.onchange=()=>{const x=pn(el.value);if(isFinite(x)&&x>=0)C.tl[+el.dataset.tz].zu=x/100;re()});
  $("bTlReset").onclick=()=>{if(confirm("Laufbahnen auf den Vorschlag zurücksetzen?")){C.tl=structuredClone(TL_DEF);re()}};
}

function drawRegeln(){
  if(C.mode!=="tarif")return drawRegelnOwn();
  const lb=C.tl.map(t=>[t.n,t.m?`Tarifgruppe ${t.m}; die Stufen richten sich nach den Jahren in der Gruppe (1., 2., 3. Jahr, danach).`
    :t.base?`Laufbahn ${t.base}, dazu ${pct(t.zu||0,0)} Funktionszulage, solange die Funktion ausgeübt wird.`
    :[...t.st].sort((a,b)=>a[0]-b[0]).map(([y,g])=>(y?"ab "+num(y,0)+" Jahren ":"Einstieg ")+g).join(" · ")]);
  const R=[["Grundsätze",[
     ["Tarif bleibt","Bezahlt wird nach der Tariftabelle Eisen und Stahl NRW. Es gibt keine eigene Lohntabelle und kein zusätzliches Geld – nur klare Regeln."],
     ["Transparenz","Jeder kann nachlesen, nach wie vielen Jahren Erfahrung er in welche Lohngruppe kommt. Keine Höhergruppierung nach Nasenfaktor."],
     ["Gewerbliche","(Tarifstundenlohn + Erschwerniszulage) × Leistungsgrad."],
     ["Sonderzahlungen","Weihnachtsgeld und Tarifzusatzentgelte nach Tarif; Überstunden separat."]]],
   ["Laufbahnen",lb],
   ...RULES.filter(([t])=>/Berufserfahrung|Interner Wechsel|Wiedereinstellung/.test(t)).map(([t,it])=>[t,it.filter(([a])=>a!=="Höhe")]),
   ["Hinweis",[["Klären","Die Eingruppierung richtet sich nach Tarif grundsätzlich nach der Tätigkeit. Ob feste Jahresstufen per Betriebsvereinbarung möglich sind, mit der IG Metall klären."],["Planungsmodell","Diskussionsentwurf; ersetzt keine tarifliche oder arbeitsrechtliche Prüfung."]]]];
  $("regeln").innerHTML=`<h2>📖 Regeln – Tarif-Laufbahn</h2><p class="lead">Entwurf – gilt nur, wenn es vereinbart wird.</p>`+
   R.map(([t,it])=>`<div class="rh">${esc(t)}</div>`+it.map(([a,b])=>`<div class="rule"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")).join("");
}
function loadTar(j){try{
  const bl=j.entgelte.bloecke,g=bl.find(b=>/gewerblich/i.test(b.t)),m=bl.find(b=>/Meister/i.test(b.t));
  if(g){const o={};g.z.forEach(z=>{const k=(z[0].match(/LG\s*\d+/)||[])[0];const v=pn(z[1]);if(k&&isFinite(v))o[k.replace(/\s+/," ")]=v});if(Object.keys(o).length>=5)TAR.lg=o}
  if(m){const o={};m.z.forEach(z=>{const v=z.slice(1).map(pn);for(let i=1;i<4;i++)if(!isFinite(v[i]))v[i]=v[i-1];if(isFinite(v[0]))o[z[0]]=v});if(Object.keys(o).length)TAR.m=o}
  if(j.entgelte.stand)TAR.stand=j.entgelte.stand}catch(e){}}

async function loadSz(manual){
  try{const j=await (await fetch("../br/tarif.json",{cache:"no-store"})).json();
    loadTar(j);
    const b=j.entgelte.bloecke.find(x=>/Sonderzahl/.test(x.t));if(!b)throw 0;
    const get=re=>(b.z.find(z=>re.test(z[0]))||[])[1]||"";
    const eu=t=>{const m=t.match(/(\d{1,3}(?:\.\d{3})*|\d+)(?:,\d+)?\s*€/);return m?pn(m[0]):NaN};
    const t1=eu(get(/zusatzentgelt I\b|zusatzentgelt I \(/i));
    const t2s=get(/zusatzentgelt II/i),t2r=t2s.match(/rund\s+([\d.,]+)\s*€/);const t2=t2r?pn(t2r[1]):eu(t2s);
    const wm=get(/Weihnacht/i).match(/(\d+)\s*%/);
    if(isFinite(t1))C.sz.tze1=t1;if(isFinite(t2))C.sz.tze2=t2;if(wm)C.sz.weih=+wm[1]/100;
    C.sz.stand=(j.entgelte.stand?"Stand "+j.entgelte.stand:"Tarif Eisen und Stahl NRW");save();
    if(manual){drawAll();alert("Sonderzahlungen übernommen: Weihnachtsgeld "+num(C.sz.weih*100,0)+" %, Tarifzusatzentgelt "+eur(C.sz.tze1,0)+" + "+eur(C.sz.tze2,0))}else{drawAll()}}
  catch(e){if(manual)alert("Die BR-App-Daten konnten nicht geladen werden.")}
}
function drawAll(){drawTable();drawPersonForm();drawWerte();drawRegeln()}
function tab(t){document.querySelectorAll(".tab").forEach(s=>s.hidden=s.id!=="t"+t);
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(+b.dataset.t===t)));LSs("verg.tab",String(t));scrollTo(0,0)}
function start(){
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tab(+b.dataset.t));
  setHead();drawAll();tab(+LSg("verg.tab","1")||1);loadSz(false);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{});
}
</script>
