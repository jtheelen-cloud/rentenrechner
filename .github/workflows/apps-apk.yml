name: Android-Apps bauen (APK)
on:
  push:
    paths: ['apk/**', '.github/workflows/apps-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: APKs bauen
        env:
          KS_PATH: ${{ github.workspace }}/apk/keystore/apps.jks
          KS_PASS: '1yrTGdPepmfvCJar4ajUNZSm'
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          cd apk && gradle assembleRenteRelease assembleBrRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - name: Als Download veröffentlichen
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp apk/app/build/outputs/apk/rente/release/app-rente-release.apk Rentenrechner.apk
          cp apk/app/build/outputs/apk/br/release/app-br-release.apk BR-Nachschlagen.apk
          gh release view apps >/dev/null 2>&1 || gh release create apps --title "Android-Apps" --notes "Rentenrechner und BR-Nachschlagen als Android-App (APK) zum Verschicken."
          gh release upload apps Rentenrechner.apk BR-Nachschlagen.apk --clobber
      - name: Fehlerprotokoll sichern
        if: failure()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan ci-log && git rm -rqf . && cp -f build.log ci.log 2>/dev/null || echo "kein Log" > ci.log
          git add ci.log && git commit -qm "Build-Log" && git push -f origin ci-log
