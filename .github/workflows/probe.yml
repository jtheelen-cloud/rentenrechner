name: Quellen-Test Gesetze
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Portal testen (2)
        run: python3 tools/probe2.py
      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tools/probe2.json tools/openapi.json || true; git add tools/probe2.json; git commit -m "Quellen-Test Ergebnis" || true; git push
