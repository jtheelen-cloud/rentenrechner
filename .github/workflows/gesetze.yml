name: Gesetze aktualisieren

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gii.py"
      - "tools/gesetze.json"
      - ".github/workflows/gesetze.yml"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gesetze laden
        run: python tools/gii.py
      - name: Änderungen speichern
        run: |
          git config user.name "gesetze-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add br/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
            echo "changed=no" >> "$GITHUB_ENV"
          else
            git commit -m "Gesetze aktualisiert ($(date +%Y-%m-%d))"
            git push
            echo "changed=yes" >> "$GITHUB_ENV"
          fi
      - name: Webseite neu bauen
        if: env.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
